name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.docker-cache
          key: docker-timescale-pg16-${{ runner.os }}

      - name: Load cached image or pull
        run: |
          if [ -f /tmp/.docker-cache/timescaledb-ha-pg16.tar ]; then
            docker load -i /tmp/.docker-cache/timescaledb-ha-pg16.tar
          else
            docker pull timescale/timescaledb-ha:pg16
            mkdir -p /tmp/.docker-cache
            docker save timescale/timescaledb-ha:pg16 -o /tmp/.docker-cache/timescaledb-ha-pg16.tar
          fi

      - name: Run tests (schema, auth unit + integration)
        working-directory: apps/api
        run: npm test

  codegen-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run gen:types

      - name: Fail if openapi.gen.ts is stale
        run: git diff --exit-code packages/shared-types/src/openapi.gen.ts
