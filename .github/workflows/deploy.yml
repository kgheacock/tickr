name: deploy

# Builds and pushes the api + web images to GHCR on every merge to main, tagged
# by commit SHA, then (optionally) triggers the VPS deploy over SSH. TODO/12
# items 9 + 10. The deploy step is opt-in: set repository variable
# DEPLOY_ENABLED=true and the DEPLOY_SSH_* secrets once the VPS exists.

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/kgheacock/tickr-api
  WEB_IMAGE: ghcr.io/kgheacock/tickr-web

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    # Opt-in once the VPS is provisioned and secrets are set.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # deploy.sh fast-forwards the repo to origin/main (this SHA), pulls the
          # images CI just pushed, audits, migrates, and smoke-tests with rollback.
          script: |
            cd /srv/tickr/repo
            git fetch origin main
            TICKR_IMAGE_TAG=${{ github.sha }} \
              docker compose -f compose/docker-compose.yml -f compose/docker-compose.prod.yml \
              --env-file /srv/tickr/secrets/tickr.env pull
            scripts/deploy.sh
