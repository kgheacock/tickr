# Dev overlay. Layered on top of docker-compose.yml:
#   docker compose -f compose/docker-compose.yml -f compose/docker-compose.dev.yml up
# (scripts/dev-up.sh / `pnpm dev` already pass both files.)
#
# Adds the dev-only conveniences kept out of the base file:
#   - Host port publishing for postgres / redis / api so you can reach them from
#     the host (psql, redis-cli, curl :3000). These must NOT exist in prod —
#     Docker's published ports bypass UFW, so a published 5432 would be world-
#     reachable. The prod overlay publishes nothing beyond Caddy's 80/443.
#   - Source bind-mounts + `tsx watch` for live reload. The api/worker/bot images
#     default to the `dev` Dockerfile target, so no `build.target` is needed here.
#   - Anonymous node_modules volumes that shadow the host tree with the image's
#     Linux-built deps.

services:
  postgres:
    ports:
      - '5432:5432'

  redis:
    ports:
      - '6379:6379'

  api:
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      # Opt in to the dev-only POST /auth/dev-login backdoor (see roles/api.ts).
      # Safe here: the prod overlay never sets this and deploy.sh refuses it.
      TICKR_DEV_AUTH: '1'
    volumes:
      - ../apps/api/src:/app/apps/api/src
      - ../packages/shared-types/src:/app/packages/shared-types/src
      # Anonymous volumes: shadow host node_modules with the image's Linux-built
      # deps. Recreated on `up --build --renew-anon-volumes` so dep changes pick
      # up cleanly.
      - /app/node_modules
      - /app/apps/api/node_modules

  worker:
    environment:
      NODE_ENV: development
    volumes:
      - ../apps/api/src:/app/apps/api/src
      - ../packages/shared-types/src:/app/packages/shared-types/src
      - /app/node_modules
      - /app/apps/api/node_modules

  bot:
    environment:
      NODE_ENV: development
    volumes:
      - ../apps/api/src:/app/apps/api/src
      - ../packages/shared-types/src:/app/packages/shared-types/src
      - /app/node_modules
      - /app/apps/api/node_modules

  caddy:
    ports:
      - '2019:2019'
