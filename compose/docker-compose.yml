name: tickr

# Base (deployment-neutral) stack. Bring it up with an environment overlay:
#   dev:  docker compose -f compose/docker-compose.yml -f compose/docker-compose.dev.yml up
#   prod: docker compose -f compose/docker-compose.yml -f compose/docker-compose.prod.yml up
#
# Dev-only concerns live in the dev overlay, NOT here, because compose overlays
# *append* to `ports`/`volumes` rather than replacing them — so anything dev-only
# left in the base would leak into prod (published DB ports, source bind-mounts).
# Keep this file free of host port publishing for postgres/redis/api and free of
# source bind-mounts; the dev overlay adds them back. See compose/Caddyfile and
# the prod overlay for the proxy.

services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tickr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tickr}
      POSTGRES_DB: ${POSTGRES_DB:-tickr}
    volumes:
      - tickr-pg-data:/home/postgres/pgdata/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-tickr} -d ${POSTGRES_DB:-tickr}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      ROLE: api
      DATABASE_URL: postgres://${POSTGRES_USER:-tickr}:${POSTGRES_PASSWORD:-tickr}@postgres:5432/${POSTGRES_DB:-tickr}
      REDIS_URL: redis://redis:6379
      PORT: '3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      ROLE: worker
      DATABASE_URL: postgres://${POSTGRES_USER:-tickr}:${POSTGRES_PASSWORD:-tickr}@postgres:5432/${POSTGRES_DB:-tickr}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      ROLE: bot
      DATABASE_URL: postgres://${POSTGRES_USER:-tickr}:${POSTGRES_PASSWORD:-tickr}@postgres:5432/${POSTGRES_DB:-tickr}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  tickr-pg-data:
  caddy-data:
  caddy-config:
