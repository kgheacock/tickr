name: tickr

services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tickr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tickr}
      POSTGRES_DB: ${POSTGRES_DB:-tickr}
    ports:
      - '5432:5432'
    volumes:
      - tickr-pg-data:/home/postgres/pgdata/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-tickr} -d ${POSTGRES_DB:-tickr}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      ROLE: api
      DATABASE_URL: postgres://${POSTGRES_USER:-tickr}:${POSTGRES_PASSWORD:-tickr}@postgres:5432/${POSTGRES_DB:-tickr}
      REDIS_URL: redis://redis:6379
      PORT: '3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api/src:/app/apps/api/src
      - ../packages/shared-types/src:/app/packages/shared-types/src
      # Anonymous volumes: shadow host node_modules with the image's Linux-built
      # deps. Recreated on `up --build` so dep changes pick up cleanly.
      - /app/node_modules
      - /app/apps/api/node_modules

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      ROLE: worker
      DATABASE_URL: postgres://${POSTGRES_USER:-tickr}:${POSTGRES_PASSWORD:-tickr}@postgres:5432/${POSTGRES_DB:-tickr}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api/src:/app/apps/api/src
      - ../packages/shared-types/src:/app/packages/shared-types/src
      - /app/node_modules
      - /app/apps/api/node_modules

  bot:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      ROLE: bot
      DATABASE_URL: postgres://${POSTGRES_USER:-tickr}:${POSTGRES_PASSWORD:-tickr}@postgres:5432/${POSTGRES_DB:-tickr}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api/src:/app/apps/api/src
      - ../packages/shared-types/src:/app/packages/shared-types/src
      - /app/node_modules
      - /app/apps/api/node_modules

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  tickr-pg-data:
  caddy-data:
  caddy-config:
