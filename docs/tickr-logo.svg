<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516 156" width="516" height="156" role="img" aria-label="tickr">
  <defs>
    <style>
    .leaf { animation-duration: 0.85s; animation-iteration-count: 1;
             animation-fill-mode: both; animation-timing-function: cubic-bezier(.45,.05,.35,1); }
    .top  { animation-name: flapTop; }
    .bot  { animation-name: flapBot; }
    @keyframes flapTop {
      0%   { transform: translate(0px,60px) scaleY(1) translate(0px,-60px); }
      50%,100% { transform: translate(0px,60px) scaleY(0) translate(0px,-60px); }
    }
    @keyframes flapBot {
      0%,50% { transform: translate(0px,60px) scaleY(0) translate(0px,-60px); }
      100%   { transform: translate(0px,60px) scaleY(1) translate(0px,-60px); }
    }
    .t0 { animation-delay: 0.25s; }
    .t1 { animation-delay: 0.70s; }
    .t2 { animation-delay: 1.15s; }
    .t3 { animation-delay: 1.60s; }
    .t4 { animation-delay: 2.05s; }
    </style>
    <linearGradient id="seam" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".45" stop-color="#000" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
    <clipPath id="tileclip"><rect width="88" height="120" rx="8"/></clipPath>
    <clipPath id="ct"><rect width="88" height="60"/></clipPath>
    <clipPath id="cb"><rect y="60" width="88" height="60"/></clipPath>
