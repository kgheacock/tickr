openapi: 3.1.0
info:
  title: tickr API
  version: v1
  description: Market-data + returns platform — v1 REST surface
servers:
  - url: /api/v1
    description: API v1

security:
  - cookieAuth: []

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session

  parameters:
    provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [google, github]

  responses:
    Unauthorized:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableEntity:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    # --- Enums ---

    OrderSide:
      type: string
      enum: [buy, sell]

    # --- Error envelope ---

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code, e.g. SYMBOL_NOT_TRADEABLE
            message:
              type: string
              description: Human-readable error message
            details:
              description: Additional error context (implementation-defined)

    # --- Core entities ---

    User:
      type: object
      required: [id, displayName, email, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: ['string', 'null']
        role:
          type: string
          enum: [player, admin]
        createdAt:
          type: string
          format: date-time

    Identity:
      type: object
      required: [provider, emailAtLink]
      properties:
        provider:
          type: string
          enum: [google, github]
        emailAtLink:
          type: ['string', 'null']

    MeResponse:
      type: object
      required: [user, identities, csrfToken, leagues]
      properties:
        user:
          $ref: '#/components/schemas/User'
        identities:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
        csrfToken:
          type: string
          description: Rotating token required in X-CSRF-Token on state-changing requests
        leagues:
          type: array
          description: Fantasy Street leagues the user is a member of, for client routing
          items:
            $ref: '#/components/schemas/LeagueMembership'

    # --- Universe ---

    UniverseItem:
      type: object
      required: [symbol, backfilled, backfilledAt, firstBarAt, lastBarAt]
      properties:
        symbol:
          type: string
        backfilled:
          type: boolean
          description: false → no price history yet
        backfilledAt:
          type: ['string', 'null']
          format: date-time
        firstBarAt:
          type: ['string', 'null']
          format: date-time
          description: Earliest price_bar.ts for the symbol
        lastBarAt:
          type: ['string', 'null']
          format: date-time
          description: Latest price_bar.ts for the symbol

    UniverseResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UniverseItem'

    # --- Symbol metadata ---

    SymbolMetadata:
      type: object
      description: >
        Company reference fields for a single symbol, sourced from Massive
        (GET /v3/reference/tickers/{ticker}) by the metadata refresh job and
        stored in symbol_metadata. Logo/icon images are served separately under
        /symbols/{symbol}/logo and /icon.
      required:
        - symbol
        - name
        - primaryExchange
        - type
        - marketCap
        - sicCode
        - sicDescription
        - homepageUrl
        - listDate
        - totalEmployees
        - description
        - fetchedAt
      properties:
        symbol:
          type: string
        name:
          type: ['string', 'null']
          description: Company name
        primaryExchange:
          type: ['string', 'null']
          description: MIC, e.g. XNAS / XNYS
        type:
          type: ['string', 'null']
          description: Security type, e.g. CS / ETF
        marketCap:
          type: ['number', 'null']
          description: Market capitalization in whole currency units (not cents)
        sicCode:
          type: ['string', 'null']
        sicDescription:
          type: ['string', 'null']
          description: SIC industry description — closest field to a sector
        homepageUrl:
          type: ['string', 'null']
        listDate:
          type: ['string', 'null']
          format: date
        totalEmployees:
          type: ['integer', 'null']
        description:
          type: ['string', 'null']
        fetchedAt:
          type: ['string', 'null']
          format: date-time
          description: When the metadata was last fetched from upstream

    # --- Prices ---

    PriceBar:
      type: object
      required: [ts, open, high, low, close, volume]
      properties:
        ts:
          type: string
          format: date-time
          description: Bar date (UTC)
        open:
          type: integer
          format: int64
          description: Cents
        high:
          type: integer
          format: int64
          description: Cents
        low:
          type: integer
          format: int64
          description: Cents
        close:
          type: integer
          format: int64
          description: Cents
        volume:
          type: ['number', 'null']

    PricesResponse:
      type: object
      required: [from, to, series, missing]
      properties:
        from:
          type: string
          format: date-time
          description: Resolved window start
        to:
          type: string
          format: date-time
          description: Resolved window end
        series:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/PriceBar'
          description: Symbol → ordered bars within the window
        missing:
          type: array
          items:
            type: string
          description: Requested symbols not in universe / with no bars

    # --- Evaluate ---

    EvaluateOrder:
      type: object
      required: [symbol, side, quantity, at]
      properties:
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/OrderSide'
        quantity:
          type: number
          exclusiveMinimum: 0
          description: Fractional shares (NUMERIC 20,8); must be > 0
        at:
          type: string
          format: date-time
          description: ISO-8601 — when this order executes

    EvaluateRequest:
      type: object
      required: [startingCash, orders]
      properties:
        startingCash:
          type: integer
          format: int64
          description: Cents
        orders:
          type: array
          items:
            $ref: '#/components/schemas/EvaluateOrder'

    EvaluatedOrder:
      type: object
      required: [symbol, side, quantity, at, fillPrice, status, rejectReason]
      properties:
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/OrderSide'
        quantity:
          type: number
        at:
          type: string
          format: date-time
        fillPrice:
          type: ['integer', 'null']
          format: int64
          description: Cents/share at-or-before `at`; null if rejected
        status:
          type: string
          enum: [filled, rejected]
        rejectReason:
          type: ['string', 'null']
          description: >-
            SYMBOL_NOT_TRADEABLE | STALE_PRICE | INSUFFICIENT_FUNDS |
            INSUFFICIENT_POSITION

    FinalPosition:
      type: object
      required: [symbol, quantity, avgCost]
      properties:
        symbol:
          type: string
        quantity:
          type: number
        avgCost:
          type: integer
          format: int64
          description: Cents per share (cost basis)

    EquityPoint:
      type: object
      required: [ts, equity]
      properties:
        ts:
          type: string
          format: date-time
        equity:
          type: integer
          format: int64
          description: Cents

    EvaluateResponse:
      type: object
      required:
        [
          orders,
          finalCash,
          finalPositions,
          finalEquity,
          totalReturnPct,
          equityCurve,
        ]
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/EvaluatedOrder'
        finalCash:
          type: integer
          format: int64
          description: Cents
        finalPositions:
          type: array
          items:
            $ref: '#/components/schemas/FinalPosition'
        finalEquity:
          type: ['integer', 'null']
          format: int64
          description: Cents (finalCash + Σ qty × last close)
        totalReturnPct:
          type: ['number', 'null']
          description: Return vs startingCash
        equityCurve:
          type: array
          items:
            $ref: '#/components/schemas/EquityPoint'

    # --- ETF ---

    EtfWeight:
      type: object
      required: [symbol, weight]
      properties:
        symbol:
          type: string
        weight:
          type: number
          description: Normalized weight (sums to 1.0 across all members)

    Etf:
      type: object
      required: [id, key, name, baseValue, baseDate, createdAt, weights]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: Stable handle, e.g. "big7" (referenced as "etf:big7" in /prices and /evaluate)
        name:
          type: string
        baseValue:
          type: integer
          format: int64
          description: Index level (cents) at baseDate — synthetic series is normalized to this
        baseDate:
          type: string
          format: date
          description: t0 the series is rebased to
        createdAt:
          type: string
          format: date-time
        weights:
          type: array
          items:
            $ref: '#/components/schemas/EtfWeight'
          description: Normalized weights (sum to 1.0)

    EtfSummary:
      type: object
      required: [id, key, name, memberCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    CreateEtfRequest:
      type: object
      required: [key, name, weights]
      properties:
        key:
          type: string
          description: Stable handle, e.g. "big7"
        name:
          type: string
        baseDate:
          type: string
          format: date
          description: t0 for normalization (defaults to earliest common bar date)
        baseValue:
          type: integer
          format: int64
          description: Cents; index level at baseDate (default 10000 = $100.00)
        weights:
          type: object
          additionalProperties:
            type: number
          description: >-
            symbol → positive weight (need not sum to 1; normalized at compute time)

    EtfListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EtfSummary'

    EtfReturnsResponse:
      type: object
      required: [from, to, returnPct]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        returnPct:
          type: ['number', 'null']
          description: Total return % of the ETF over the window; null if no bars in window

    # --- Strategy / backtest ---

    SmaStrategyRequest:
      type: object
      required: [etfKey]
      properties:
        etfKey:
          type: string
          description: ETF key to backtest (e.g. "sp500")
        shortWindow:
          type: integer
          minimum: 1
          description: Short SMA window in daily closes (default 20)
        longWindow:
          type: integer
          minimum: 1
          description: Long SMA window in daily closes (default 50)
        startingCash:
          type: integer
          format: int64
          description: Cents; starting cash for the backtest (default 1000000 = $10,000)
        from:
          type: string
          description: ISO date/datetime; window start (default full series)
        to:
          type: string
          description: ISO date/datetime; window end (default now)

    StrategyLeg:
      type: object
      required: [equityCurve, totalReturnPct, maxDrawdownPct]
      properties:
        equityCurve:
          type: array
          items:
            $ref: '#/components/schemas/EquityPoint'
          description: Dense daily equity (cents) over the window
        totalReturnPct:
          type: ['number', 'null']
          description: Total return % vs startingCash; null if no data
        maxDrawdownPct:
          type: ['number', 'null']
          description: Largest peak-to-trough drawdown as a positive %; null if no data

    StrategyBacktestResponse:
      type: object
      required:
        [
          etfKey,
          shortWindow,
          longWindow,
          startingCash,
          from,
          to,
          strategy,
          buyHold,
          orders,
        ]
      properties:
        etfKey:
          type: string
        shortWindow:
          type: integer
        longWindow:
          type: integer
        startingCash:
          type: integer
          format: int64
        from:
          type: string
        to:
          type: string
        strategy:
          $ref: '#/components/schemas/StrategyLeg'
        buyHold:
          $ref: '#/components/schemas/StrategyLeg'
          description: Buy-and-hold baseline of the same ETF over the window
        orders:
          type: array
          items:
            $ref: '#/components/schemas/EvaluatedOrder'
          description: Faithful point-in-time fills from replaying the order series through /evaluate

    # --- Admin ---

    UpsertUniverseRequest:
      type: object
      required: [symbols]
      properties:
        symbols:
          type: array
          items:
            type: string
          description: Symbols to add or update in the corpus

    BackfillRequest:
      type: object
      required: [symbol]
      properties:
        symbol:
          type: string
          description: Symbol to re-trigger backfill for

    OpsResponse:
      type: object
      required:
        - lastEodUpdateAt
        - eodUpdateLagSec
        - marketData429sLast24h
        - jobQueueDepth
        - backfillRemaining
        - fantasy
        - worstLag
        - jobs
      properties:
        lastEodUpdateAt:
          type: ['string', 'null']
          description: ISO timestamp of the last successful EOD price-update run; null if none yet
        eodUpdateLagSec:
          type: ['integer', 'null']
          description: Seconds since the last EOD update (now - lastEodUpdateAt)
        marketData429sLast24h:
          type: object
          required: [massive]
          properties:
            massive:
              type: integer
              description: Massive 429 count in the trailing 24h
        jobQueueDepth:
          type: integer
          description: Currently-held worker job locks (backfill / session-update)
        backfillRemaining:
          type: integer
          description: Count of universe_symbol rows with backfilled = false
        fantasy:
          $ref: '#/components/schemas/FantasyHealth'
        worstLag:
          type: ['object', 'null']
          description: >-
            Worst price-bar staleness across the playable corpus — the symbol
            whose latest bar is furthest behind the freshness reference (now
            during the session, else the most recent NYSE close). null when no
            playable symbol has any bars.
          required: [symbol, latestBarAt, lagSec]
          properties:
            symbol:
              type: string
              description: The worst-lagging playable symbol
            latestBarAt:
              type: string
              description: ISO timestamp of that symbol's most recent bar
            lagSec:
              type: integer
              description: Seconds between the freshness reference and latestBarAt (>= 0)
        jobs:
          type: array
          description: >-
            Per-job run status for the scheduled worker jobs, in registry order.
            One entry per known job, including jobs that have never run (e.g.
            external-data jobs under TICKR_DISABLE_REMOTE_JOBS).
          items:
            $ref: '#/components/schemas/JobStatus'

    JobStatus:
      type: object
      description: Last-run status of one scheduled worker job (admin /admin/jobs viewer)
      required:
        - name
        - cadence
        - cron
        - description
        - remote
        - running
        - lastStartAt
        - lastFinishAt
        - lastOutcome
        - lastDurationMs
        - lastError
        - lastSkipAt
        - runs
        - fails
        - skips
      properties:
        name:
          type: string
          description: Stable job identifier (kebab-case); distinct per job even when two jobs share a lock
        cadence:
          type: string
          description: Human-readable schedule (e.g. "Fri 21:35 UTC")
        cron:
          type: string
          description: Cron expression(s) the job is scheduled on, for reference
        description:
          type: string
          description: What the job does
        remote:
          type: boolean
          description: >-
            True for jobs that reach an external data API; these are skipped
            entirely under TICKR_DISABLE_REMOTE_JOBS, so "never ran" in dev is
            expected rather than a fault.
        running:
          type: boolean
          description: True while a run is in flight (per-job marker with a TTL crash-net)
        lastStartAt:
          type: ['string', 'null']
          description: ISO timestamp the job last started, or null if it has never run
        lastFinishAt:
          type: ['string', 'null']
          description: ISO timestamp the last actual execution finished, or null
        lastOutcome:
          type: ['string', 'null']
          enum: [ok, error, null]
          description: Outcome of the last actual execution (never a busy-skip), or null
        lastDurationMs:
          type: ['integer', 'null']
          description: Duration of the last execution in ms, or null
        lastError:
          type: ['string', 'null']
          description: Truncated error from the last failed execution; null/empty after a success
        lastSkipAt:
          type: ['string', 'null']
          description: ISO timestamp a firing was last skipped because the prior run still held the lock
        runs:
          type: integer
          description: Lifetime count of actual executions
        fails:
          type: integer
          description: Lifetime count of executions that threw
        skips:
          type: integer
          description: Lifetime count of busy-skips (lock already held)

    # --- Fantasy Street: leagues & membership (item 01) ---

    RosterConfig:
      type: object
      description: Slot layout for a league's weekly lineup plus bench depth
      required: [slots, bench]
      properties:
        slots:
          type: array
          description: Named starting slots (Anchor, Growth, Momentum, Value, Defense, Wildcard)
          items:
            type: string
        bench:
          type: integer
          description: Number of bench slots (0–4)

    LeagueMember:
      type: object
      required: [userId, displayName, teamName, role, joinedAt]
      properties:
        userId:
          type: string
        displayName:
          type: string
        teamName:
          type: ['string', 'null']
        role:
          type: string
          enum: [commissioner, manager]
        joinedAt:
          type: string
          format: date-time

    LeagueView:
      type: object
      required:
        - id
        - name
        - commissionerUserId
        - size
        - seasonLengthWeeks
        - rosterConfig
        - joinPolicy
        - status
        - createdAt
        - members
        - openSlots
      properties:
        id:
          type: string
        name:
          type: string
        commissionerUserId:
          type: string
        size:
          type: integer
          description: Max managers (4–12)
        seasonLengthWeeks:
          type: integer
        rosterConfig:
          $ref: '#/components/schemas/RosterConfig'
        joinPolicy:
          type: string
          enum: [invite, open]
        status:
          type: string
          enum: [forming, drafting, active, playoffs, archived]
        createdAt:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: '#/components/schemas/LeagueMember'
        openSlots:
          type: integer
          description: size − current member count

    LeagueSummary:
      type: object
      required:
        - id
        - name
        - size
        - seasonLengthWeeks
        - joinPolicy
        - status
        - memberCount
        - openSlots
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        size:
          type: integer
        seasonLengthWeeks:
          type: integer
        joinPolicy:
          type: string
          enum: [invite, open]
        status:
          type: string
          enum: [forming, drafting, active, playoffs, archived]
        memberCount:
          type: integer
        openSlots:
          type: integer
        createdAt:
          type: string
          format: date-time

    LeagueListResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LeagueSummary'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    LeagueMembership:
      type: object
      description: A user's membership in a league, as surfaced on /me
      required: [leagueId, teamName, role, status]
      properties:
        leagueId:
          type: string
        teamName:
          type: ['string', 'null']
        role:
          type: string
          enum: [commissioner, manager]
        status:
          type: string
          enum: [forming, drafting, active, playoffs, archived]

    Invite:
      type: object
      required: [token, leagueId, expiresAt, maxUses, uses, createdAt]
      properties:
        token:
          type: string
        leagueId:
          type: string
        expiresAt:
          type: ['string', 'null']
          format: date-time
        maxUses:
          type: ['integer', 'null']
        uses:
          type: integer
        createdAt:
          type: string
          format: date-time

    CreateLeagueRequest:
      type: object
      required: [name, size, seasonLengthWeeks, joinPolicy]
      properties:
        name:
          type: string
        size:
          type: integer
          description: 4–12
        seasonLengthWeeks:
          type: integer
        rosterConfig:
          $ref: '#/components/schemas/RosterConfig'
        joinPolicy:
          type: string
          enum: [invite, open]

    UpdateLeagueRequest:
      type: object
      description: Commissioner settings edit; allowed only while status = forming
      properties:
        name:
          type: string
        size:
          type: integer
        seasonLengthWeeks:
          type: integer
        rosterConfig:
          $ref: '#/components/schemas/RosterConfig'
        joinPolicy:
          type: string
          enum: [invite, open]

    CreateInviteRequest:
      type: object
      properties:
        expiresInHours:
          type: integer
          description: Invite lifetime in hours; omit for no expiry
        maxUses:
          type: integer
          description: Cap on accepted joins; omit for unlimited until expiry

    JoinLeagueRequest:
      type: object
      properties:
        token:
          type: string
          description: Invite token; required for invite-only leagues, optional for open leagues

    # --- Players & grouping (item 02) ---

    PlayerGroup:
      type: string
      description: A draftable slot family a stock can qualify for
      enum: [anchor, growth, momentum, value, defense, wildcard]

    PlayerMetrics:
      type: object
      description: Price-derived metrics behind a stock's group eligibility
      required: [ret3mPct, ret12mPct, sigma, avgVolume]
      properties:
        ret3mPct:
          type: ['number', 'null']
          description: Trailing ~3-month price return, percent
        ret12mPct:
          type: ['number', 'null']
          description: Trailing ~12-month price return, percent
        sigma:
          type: ['number', 'null']
          description: Stddev of trailing daily returns (~90d), as a fraction
        avgVolume:
          type: ['number', 'null']
          description: Mean daily volume over the window; null when unavailable

    PlayerOwnership:
      type: object
      description: Per-league ownership status for a stock
      required: [owned]
      properties:
        owned:
          type: boolean
        ownerTeam:
          type: ['string', 'null']
          description: Team name of the owning manager, when owned
        isShort:
          type: ['boolean', 'null']
          description: Whether the owner holds it as a short (defense), when owned

    PlayerInventoryItem:
      type: object
      required: [symbol, groups, recentReturnPct, ownership]
      properties:
        symbol:
          type: string
        groups:
          type: array
          items:
            $ref: '#/components/schemas/PlayerGroup'
        recentReturnPct:
          type: ['number', 'null']
          description: Trailing ~3-month return, surfaced for scouting
        ownership:
          $ref: '#/components/schemas/PlayerOwnership'

    PlayerListResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlayerInventoryItem'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    PlayerDetail:
      type: object
      required:
        - symbol
        - groups
        - eligibleSlots
        - recentReturnPct
        - metrics
        - ownership
        - prices
      properties:
        symbol:
          type: string
        groups:
          type: array
          items:
            $ref: '#/components/schemas/PlayerGroup'
        eligibleSlots:
          type: array
          description: Roster slot names this stock may fill
          items:
            type: string
        recentReturnPct:
          type: ['number', 'null']
        metrics:
          $ref: '#/components/schemas/PlayerMetrics'
        ownership:
          $ref: '#/components/schemas/PlayerOwnership'
        prices:
          type: array
          description: Price-history window (~1y) for the detail chart
          items:
            $ref: '#/components/schemas/PriceBar'

    # --- Live draft (item 03) ---

    DraftStatus:
      type: string
      description: Lifecycle of a league's snake draft
      enum: [scheduled, in_progress, complete]

    DraftPick:
      type: object
      description: One landed pick in the snake order; the immutable draft log
      required: [overallPick, round, userId, symbol, isShort, auto, pickedAt]
      properties:
        overallPick:
          type: integer
          description: 1-based position in the overall snake order
        round:
          type: integer
          description: 1-based draft round
        userId:
          type: string
        symbol:
          type: string
        isShort:
          type: boolean
          description: Drafted as a short (Defense), scored as the inverse return
        auto:
          type: boolean
          description: True when the pick clock expired and auto-draft chose it
        pickedAt:
          type: string
          format: date-time

    DraftSlot:
      type: object
      description: A seat in the snake order, present whether or not it is filled
      required: [overallPick, round, userId]
      properties:
        overallPick:
          type: integer
        round:
          type: integer
        userId:
          type: string
          description: Manager on the clock for this position

    DraftState:
      type: object
      description: The live draft board — order, picks so far, and the clock
      required:
        - id
        - leagueId
        - status
        - pickSeconds
        - totalRounds
        - totalPicks
        - currentOverallPick
        - onClockUserId
        - deadline
        - order
        - picks
      properties:
        id:
          type: string
        leagueId:
          type: string
        status:
          $ref: '#/components/schemas/DraftStatus'
        pickSeconds:
          type: integer
        totalRounds:
          type: integer
          description: slots + bench; every manager makes this many picks
        totalPicks:
          type: integer
          description: size × totalRounds; the length of the snake order
        currentOverallPick:
          type: integer
          description: Position on the clock; exceeds totalPicks once complete
        onClockUserId:
          type: ['string', 'null']
          description: Manager currently on the clock; null when complete
        deadline:
          type: ['string', 'null']
          format: date-time
          description: When the current pick expires; null when not in progress
        order:
          type: array
          description: The full snake order, one seat per overall pick
          items:
            $ref: '#/components/schemas/DraftSlot'
        picks:
          type: array
          items:
            $ref: '#/components/schemas/DraftPick'

    MakePickRequest:
      type: object
      required: [symbol]
      properties:
        symbol:
          type: string
        isShort:
          type: boolean
          description: Draft the stock as a short into the Defense slot
          default: false

    # --- Fantasy Street: rosters & weekly lineups (item 04) ---

    LineupSlot:
      type: object
      description: One filled slot in a weekly lineup
      required: [slot, slotIndex, symbol, isShort]
      properties:
        slot:
          type: string
          enum: [anchor, growth, momentum, value, defense, wildcard, bench]
        slotIndex:
          type: integer
          description: Disambiguates repeated slots (bench, duplicate slots)
        symbol:
          type: string
        isShort:
          type: boolean
          description: True for a Defense short; false for every long slot

    Lineup:
      type: object
      description: A manager's weekly starting lineup and its lock state
      required:
        - leagueId
        - userId
        - season
        - week
        - locked
        - lockedAt
        - autoFilled
        - slots
      properties:
        leagueId:
          type: string
        userId:
          type: string
        season:
          type: integer
        week:
          type: integer
        locked:
          type: boolean
          description: True once the scoring week's market open froze the lineup
        lockedAt:
          type: ['string', 'null']
          format: date-time
        autoFilled:
          type: boolean
          description: True when the lock job auto-filled one or more slots
        slots:
          type: array
          items:
            $ref: '#/components/schemas/LineupSlot'

    SetLineupSlot:
      type: object
      required: [slot, symbol]
      properties:
        slot:
          type: string
          enum: [anchor, growth, momentum, value, defense, wildcard, bench]
        slotIndex:
          type: integer
          default: 0
          description: Position within a repeated slot; defaults to 0
        symbol:
          type: string

    SetLineupRequest:
      type: object
      required: [week, slots]
      properties:
        week:
          type: integer
        season:
          type: integer
          default: 1
        slots:
          type: array
          items:
            $ref: '#/components/schemas/SetLineupSlot'

    # --- Scoring & shorting (item 05) ---
    ScoreBreakdownItem:
      type: object
      description: One started slot's contribution to a manager's weekly score
      required: [slot, symbol, isShort, lastClose, thisClose, returnPct, points]
      properties:
        slot:
          type: string
          enum: [anchor, growth, momentum, value, defense, wildcard, bench]
        symbol:
          type: string
        isShort:
          type: boolean
          description: True for a Defense short (scored as −r×10)
        lastClose:
          type: ['number', 'null']
          description: Prior-Friday close in cents, or null if no bar resolved
        thisClose:
          type: ['number', 'null']
          description: This-Friday (or as-of) close in cents, or null
        returnPct:
          type: ['number', 'null']
          description: Week percent return, or null when a close was missing
        points:
          type: number
          description: Slot points (r×10 long, −r×10 short), rounded to 2 dp

    WeeklyScore:
      type: object
      description: A manager's weekly point total and its per-slot breakdown
      required:
        - leagueId
        - userId
        - season
        - week
        - totalPoints
        - computedAt
        - provisional
        - breakdown
      properties:
        leagueId:
          type: string
        userId:
          type: string
        season:
          type: integer
        week:
          type: integer
        totalPoints:
          type: number
          description: Uncapped sum of started slots (losses included)
        computedAt:
          type: string
          format: date-time
        provisional:
          type: boolean
          description: True for an in-week live total; false once Friday-settled
        breakdown:
          type: array
          items:
            $ref: '#/components/schemas/ScoreBreakdownItem'

    LeagueScoresResponse:
      type: object
      description: Every manager's settled score for one league week
      required: [season, week, scores]
      properties:
        season:
          type: integer
        week:
          type: integer
        scores:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyScore'

    # --- Matchups, schedule & standings (item 06) ---

    Matchup:
      type: object
      description: One head-to-head for a (league, season, week)
      required: [id, leagueId, season, week, homeUserId, status]
      properties:
        id:
          type: string
        leagueId:
          type: string
        season:
          type: integer
        week:
          type: integer
        homeUserId:
          type: string
        awayUserId:
          type: ['string', 'null']
          description: Opponent; null is a bye (home manager sits, no-contest)
        homePoints:
          type: ['number', 'null']
          description: Home total — settled, or live when provisional, else null
        awayPoints:
          type: ['number', 'null']
          description: Away total; null for a bye or before scoring
        winnerUserId:
          type: ['string', 'null']
          description: Higher-scoring side; null for a tie, bye, or unsettled
        status:
          type: string
          enum: [scheduled, final]

    ScheduleResponse:
      type: object
      description: A league's full-season round-robin
      required: [season, matchups]
      properties:
        season:
          type: integer
        matchups:
          type: array
          items:
            $ref: '#/components/schemas/Matchup'

    MatchupsResponse:
      type: object
      description: One week's head-to-heads; provisional overlays live points
      required: [season, week, provisional, matchups]
      properties:
        season:
          type: integer
        week:
          type: integer
        provisional:
          type: boolean
          description: True when points are live (the week has not settled)
        matchups:
          type: array
          items:
            $ref: '#/components/schemas/Matchup'

    Standing:
      type: object
      description: One manager's standings row with the tiebreaker fields exposed
      required:
        - userId
        - wins
        - losses
        - ties
        - pointsFor
        - pointsAgainst
        - rank
      properties:
        userId:
          type: string
        wins:
          type: integer
        losses:
          type: integer
        ties:
          type: integer
        pointsFor:
          type: number
        pointsAgainst:
          type: number
        rank:
          type: integer
          description: 1-based finishing position after the tiebreaker sort

    StandingsResponse:
      type: object
      description: A league's standings, ranked by the documented tiebreakers
      required: [season, standings]
      properties:
        season:
          type: integer
        standings:
          type: array
          items:
            $ref: '#/components/schemas/Standing'

    # --- Waivers & trades (item 07) ---

    WaiverClaim:
      type: object
      description: A queued add/drop request, resolved by the waiver run
      required:
        - id
        - leagueId
        - season
        - userId
        - addSymbol
        - dropSymbol
        - isShort
        - status
        - submittedAt
        - processedAt
      properties:
        id:
          type: string
        leagueId:
          type: string
        season:
          type: integer
        userId:
          type: string
        addSymbol:
          type: string
        dropSymbol:
          type: string
        isShort:
          type: boolean
          description: True when the add fills the Defense (short) slot
        status:
          type: string
          enum: [pending, won, lost, invalid]
        submittedAt:
          type: string
          format: date-time
        processedAt:
          type: ['string', 'null']
          format: date-time
          description: When the waiver run resolved the claim; null while pending

    WaiverOrderEntry:
      type: object
      description: One manager's slot in the rolling waiver priority order
      required: [userId, priority]
      properties:
        userId:
          type: string
        priority:
          type: integer
          description: Lower claims first; reverse standings, demoted on a win

    SubmitWaiverRequest:
      type: object
      description: Queue an add/drop waiver claim
      required: [addSymbol, dropSymbol]
      properties:
        addSymbol:
          type: string
        dropSymbol:
          type: string
        isShort:
          type: boolean
          description: Add into the Defense (short) slot
          default: false

    WaiversResponse:
      type: object
      description: A manager's claims and the league's current waiver order
      required: [season, claims, order]
      properties:
        season:
          type: integer
        claims:
          type: array
          items:
            $ref: '#/components/schemas/WaiverClaim'
        order:
          type: array
          items:
            $ref: '#/components/schemas/WaiverOrderEntry'

    TradeItem:
      type: object
      description: One leg of a trade — symbol moves from fromUserId to the other side
      required: [fromUserId, symbol, isShort]
      properties:
        fromUserId:
          type: string
        symbol:
          type: string
        isShort:
          type: boolean

    Trade:
      type: object
      description: A manager-to-manager trade proposal and its lifecycle
      required:
        - id
        - leagueId
        - proposerUserId
        - targetUserId
        - status
        - createdAt
        - resolvedAt
        - items
      properties:
        id:
          type: string
        leagueId:
          type: string
        proposerUserId:
          type: string
        targetUserId:
          type: string
        status:
          type: string
          enum: [proposed, accepted, rejected, cancelled, expired]
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: ['string', 'null']
          format: date-time
          description: When the trade was accepted/rejected/cancelled; null while proposed
        items:
          type: array
          items:
            $ref: '#/components/schemas/TradeItem'

    ProposeTradeRequest:
      type: object
      description: Offer give-symbols (the proposer's) for receive-symbols (the target's)
      required: [targetUserId]
      properties:
        targetUserId:
          type: string
        give:
          type: array
          description: Symbols the proposer offers
          items:
            type: string
        receive:
          type: array
          description: Symbols the proposer wants in return
          items:
            type: string

    TradesResponse:
      type: object
      description: A manager's incoming (target) and outgoing (proposer) trades
      required: [incoming, outgoing]
      properties:
        incoming:
          type: array
          items:
            $ref: '#/components/schemas/Trade'
        outgoing:
          type: array
          items:
            $ref: '#/components/schemas/Trade'

    # --- Season & playoffs (item 08) ---

    Season:
      type: object
      description: One season's lifecycle row for a league
      required:
        - id
        - leagueId
        - seasonNumber
        - status
        - regularWeeks
        - playoffSeeds
        - championUserId
        - startedAt
        - endedAt
      properties:
        id:
          type: string
        leagueId:
          type: string
        seasonNumber:
          type: integer
        status:
          type: string
          enum: [regular, playoffs, archived]
        regularWeeks:
          type: integer
          description: Regular-season length; the bracket opens the week after
        playoffSeeds:
          type: integer
          description: Top-K standings seeds into the single-elim bracket
        championUserId:
          type: ['string', 'null']
          description: Crowned once the final playoff matchup settles
        startedAt:
          type: ['string', 'null']
          format: date-time
        endedAt:
          type: ['string', 'null']
          format: date-time

    SeasonsResponse:
      type: object
      description: A league's seasons, newest first
      required: [seasons]
      properties:
        seasons:
          type: array
          items:
            $ref: '#/components/schemas/Season'

    SeasonDetail:
      type: object
      description: One season with its final standings and playoff bracket
      required: [season, standings, playoffMatchups]
      properties:
        season:
          $ref: '#/components/schemas/Season'
        standings:
          type: array
          items:
            $ref: '#/components/schemas/Standing'
        playoffMatchups:
          type: array
          items:
            $ref: '#/components/schemas/Matchup'

    # --- Fantasy Street: auto-managers / bots (item 10) ---

    AddBotsRequest:
      type: object
      description: Fill `count` empty league slots with auto-managers (bots)
      required: [count]
      properties:
        count:
          type: integer
          minimum: 1
          description: Number of auto-managers to add, up to the open-slot count

    # --- Fantasy Street: reminders & recaps (item 11) ---

    Notification:
      type: object
      description: >-
        One persisted, in-app notification for a manager. `kind` selects the
        payload shape: lineup_reminder/draft_reminder carry simple context,
        recap carries a RecapPayload. Surfaced on the FS-09 dashboard feed and
        pushed live over WS.
      required: [id, leagueId, kind, payload, createdAt, readAt]
      properties:
        id:
          type: string
        leagueId:
          type: string
        kind:
          type: string
          enum: [lineup_reminder, draft_reminder, recap]
        payload:
          type: object
          additionalProperties: true
          description: Kind-specific body; recap rows hold a RecapPayload
        createdAt:
          type: string
          format: date-time
        readAt:
          type: ['string', 'null']
          format: date-time
          description: When the manager marked it read, else null

    NotificationsResponse:
      type: object
      description: A manager's notifications for a league, newest first
      required: [notifications]
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'

    RecapSlot:
      type: object
      description: One started slot picked out for the recap (mover or blowup)
      required: [slot, symbol, points]
      properties:
        slot:
          type: string
        symbol:
          type: string
        points:
          type: number

    RecapLeader:
      type: object
      description: A league high/low entry for the recap
      required: [userId, totalPoints]
      properties:
        userId:
          type: string
        totalPoints:
          type: number

    RecapPayload:
      type: object
      description: >-
        The post-settle weekly recap for one manager, composed from the FS-05
        per-slot breakdown and the FS-06 settled matchup. `result` is the
        head-to-head outcome (bye when the manager had no opponent).
      required:
        - season
        - week
        - result
        - myScore
        - oppScore
        - oppUserId
        - biggestMover
        - biggestBlowup
        - leagueHigh
        - leagueLow
      properties:
        season:
          type: integer
        week:
          type: integer
        result:
          type: string
          enum: [win, loss, tie, bye]
        myScore:
          type: number
        oppScore:
          type: ['number', 'null']
          description: Opponent's total; null on a bye
        oppUserId:
          type: ['string', 'null']
        biggestMover:
          oneOf:
            - $ref: '#/components/schemas/RecapSlot'
            - type: 'null'
          description: Highest-scoring started slot, or null if none scored
        biggestBlowup:
          oneOf:
            - $ref: '#/components/schemas/RecapSlot'
            - type: 'null'
          description: Most-negative started slot, or null if none scored
        leagueHigh:
          $ref: '#/components/schemas/RecapLeader'
        leagueLow:
          $ref: '#/components/schemas/RecapLeader'

    # --- Fantasy Street: commissioner & admin tools (item 12) ---

    AuditEntry:
      type: object
      description: >-
        One append-only record of a privileged league action (commissioner or
        platform admin). `action` is a stable verb; `detail` carries
        action-specific context (changed fields, target week, dispute reason).
      required: [id, leagueId, actorUserId, action, detail, createdAt]
      properties:
        id:
          type: string
        leagueId:
          type: string
        actorUserId:
          type: string
          description: The commissioner/admin who took the action
        action:
          type: string
          description: >-
            Stable verb: settings.update, member.remove, member.rename,
            member.transfer, score.rescore, season.advance, lineup.override
        detail:
          type: object
          additionalProperties: true
          description: Action-specific context (changed fields, week, reason, …)
        createdAt:
          type: string
          format: date-time

    AuditResponse:
      type: object
      description: A league's audit trail, newest first
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'

    StuckWeek:
      type: object
      description: >-
        A locked-but-unscored week that a later settled week has surpassed — a
        genuine settle gap an operator should resolve (re-score / force-advance).
      required: [leagueId, season, week]
      properties:
        leagueId:
          type: string
        season:
          type: integer
        week:
          type: integer

    LeagueScoringRun:
      type: object
      description: The most recent settled scoring run for a league
      required: [leagueId, lastRunAt]
      properties:
        leagueId:
          type: string
        lastRunAt:
          type: string
          format: date-time

    FantasyHealth:
      type: object
      description: >-
        Per-fleet Fantasy Street health for the admin ops view (item 12):
        league counts by status, drafts in progress, stuck weeks, and the last
        scoring run per league.
      required:
        - leaguesByStatus
        - draftsInProgress
        - stuckWeeks
        - lastScoringRunByLeague
      properties:
        leaguesByStatus:
          type: object
          description: League count keyed by lifecycle status
          required: [forming, drafting, active, playoffs, archived]
          properties:
            forming:
              type: integer
            drafting:
              type: integer
            active:
              type: integer
            playoffs:
              type: integer
            archived:
              type: integer
        draftsInProgress:
          type: integer
          description: Drafts currently in_progress across the fleet
        stuckWeeks:
          type: array
          items:
            $ref: '#/components/schemas/StuckWeek'
        lastScoringRunByLeague:
          type: array
          items:
            $ref: '#/components/schemas/LeagueScoringRun'

paths:
  # --- Auth & session ---

  /auth/{provider}/start:
    get:
      summary: Begin OAuth flow
      operationId: authStart
      tags: [auth]
      security: []
      parameters:
        - $ref: '#/components/parameters/provider'
      responses:
        '302':
          description: Redirect to provider
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/{provider}/callback:
    get:
      summary: OAuth redirect target; sets session cookie
      operationId: authCallback
      tags: [auth]
      security: []
      parameters:
        - $ref: '#/components/parameters/provider'
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to app
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/logout:
    post:
      summary: Clear session
      operationId: authLogout
      tags: [auth]
      responses:
        '204':
          description: Session cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/link/{provider}/start:
    post:
      summary: Link an additional SSO identity
      operationId: authLinkStart
      tags: [auth]
      parameters:
        - $ref: '#/components/parameters/provider'
      responses:
        '302':
          description: Redirect to provider
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /me:
    get:
      summary: Current user, linked identities, and CSRF token
      operationId: getMe
      tags: [user]
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # --- Platform: market data + evaluation ---

  /universe:
    get:
      summary: The corpus of symbols with backfill state and bar-coverage bounds
      operationId: getUniverse
      tags: [platform]
      parameters:
        - name: backfilled
          in: query
          required: false
          schema:
            type: boolean
          description: When true, only symbols with price history
      responses:
        '200':
          description: Universe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniverseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /symbols/{symbol}/metadata:
    get:
      summary: Company reference metadata for a symbol (from symbol_metadata)
      operationId: getSymbolMetadata
      tags: [platform]
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
          description: Universe symbol, e.g. AAPL or BRK.B (case-insensitive)
      responses:
        '200':
          description: Symbol metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SymbolMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /symbols/{symbol}/logo:
    get:
      summary: Company logo image (downloaded from Massive into symbol_branding)
      operationId: getSymbolLogo
      tags: [platform]
      # Public: non-sensitive logos, served unauthenticated and CDN-cacheable.
      security: []
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
          description: Universe symbol, e.g. AAPL or BRK-B (case-insensitive)
      responses:
        '200':
          description: The logo image bytes (SVG/PNG; see Content-Type)
          content:
            image/svg+xml:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '304':
          description: Not modified (matched If-None-Match)
        '404':
          $ref: '#/components/responses/NotFound'

  /symbols/{symbol}/icon:
    get:
      summary: Company icon image (downloaded from Massive into symbol_branding)
      operationId: getSymbolIcon
      tags: [platform]
      # Public: non-sensitive icons, served unauthenticated and CDN-cacheable.
      security: []
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
          description: Universe symbol, e.g. AAPL or BRK-B (case-insensitive)
      responses:
        '200':
          description: The icon image bytes (PNG/JPEG; see Content-Type)
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '304':
          description: Not modified (matched If-None-Match)
        '404':
          $ref: '#/components/responses/NotFound'

  /prices:
    get:
      summary: Pricing history for a corpus, from price_bar
      operationId: getPrices
      tags: [platform]
      parameters:
        - name: symbols
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated symbols, e.g. AAPL,MSFT (≤ 100)
        - name: from
          in: query
          required: false
          schema:
            type: string
          description: ISO date/datetime; window start (default to − 2y)
        - name: to
          in: query
          required: false
          schema:
            type: string
          description: ISO date/datetime; window end (default now)
      responses:
        '200':
          description: Price history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /evaluate:
    post:
      summary: Evaluate the returns of a series of orders, replayed against history
      operationId: evaluate
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateRequest'
      responses:
        '200':
          description: Evaluation result (stateless; nothing persisted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # --- ETFs ---

  /etfs:
    get:
      summary: List defined ETFs
      operationId: listEtfs
      tags: [etf]
      responses:
        '200':
          description: ETF list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtfListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Define a new ETF from a weighted set of universe symbols
      operationId: createEtf
      tags: [etf]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEtfRequest'
      responses:
        '201':
          description: ETF created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Etf'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /etfs/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: ETF key, e.g. "big7"
    get:
      summary: Get ETF detail including normalized weights
      operationId: getEtf
      tags: [etf]
      responses:
        '200':
          description: ETF detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Etf'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /etfs/{key}/returns:
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Total return % of the ETF over a window
      operationId: getEtfReturns
      tags: [etf]
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
          description: ISO date/datetime; window start
        - name: to
          in: query
          required: false
          schema:
            type: string
          description: ISO date/datetime; window end (default now)
      responses:
        '200':
          description: ETF return over the window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtfReturnsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # --- Strategy / backtest ---

  /strategies/sma-crossover:
    post:
      summary: Backtest the built-in SMA-crossover strategy on an ETF
      operationId: runSmaStrategy
      tags: [strategy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmaStrategyRequest'
      responses:
        '200':
          description: Backtest result with strategy and buy-and-hold equity curves
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyBacktestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # --- Admin ---

  /admin/universe/upsert:
    post:
      summary: Add or update corpus membership rows
      operationId: adminUpsertUniverse
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertUniverseRequest'
      responses:
        '200':
          description: Upserted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/universe/backfill:
    post:
      summary: Manually re-trigger backfill for a symbol
      operationId: adminBackfillUniverse
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackfillRequest'
      responses:
        '200':
          description: Backfill flag reset
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/ops:
    get:
      summary: Operational view (EOD-update lag, market data 429s, queue depth, backfill remaining)
      operationId: adminOps
      tags: [admin]
      responses:
        '200':
          description: Platform health snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
