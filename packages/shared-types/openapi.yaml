openapi: 3.1.0
info:
  title: tickr API
  version: v1
  description: Market-data + returns platform — v1 REST surface
servers:
  - url: /api/v1
    description: API v1

security:
  - cookieAuth: []

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session

  parameters:
    provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [google, github]

  responses:
    Unauthorized:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableEntity:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    # --- Enums ---

    OrderSide:
      type: string
      enum: [buy, sell]

    # --- Error envelope ---

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code, e.g. SYMBOL_NOT_TRADEABLE
            message:
              type: string
              description: Human-readable error message
            details:
              description: Additional error context (implementation-defined)

    # --- Core entities ---

    User:
      type: object
      required: [id, displayName, email, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: ['string', 'null']
        role:
          type: string
          enum: [player, admin]
        createdAt:
          type: string
          format: date-time

    Identity:
      type: object
      required: [provider, emailAtLink]
      properties:
        provider:
          type: string
          enum: [google, github]
        emailAtLink:
          type: ['string', 'null']

    MeResponse:
      type: object
      required: [user, identities, csrfToken]
      properties:
        user:
          $ref: '#/components/schemas/User'
        identities:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
        csrfToken:
          type: string
          description: Rotating token required in X-CSRF-Token on state-changing requests

    # --- Universe ---

    UniverseItem:
      type: object
      required: [symbol, backfilled, backfilledAt, firstBarAt, lastBarAt]
      properties:
        symbol:
          type: string
        backfilled:
          type: boolean
          description: false → no price history yet
        backfilledAt:
          type: ['string', 'null']
          format: date-time
        firstBarAt:
          type: ['string', 'null']
          format: date-time
          description: Earliest price_bar.ts for the symbol
        lastBarAt:
          type: ['string', 'null']
          format: date-time
          description: Latest price_bar.ts for the symbol

    UniverseResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UniverseItem'

    # --- Prices ---

    PriceBar:
      type: object
      required: [ts, open, high, low, close, volume]
      properties:
        ts:
          type: string
          format: date-time
          description: Bar date (UTC)
        open:
          type: integer
          format: int64
          description: Cents
        high:
          type: integer
          format: int64
          description: Cents
        low:
          type: integer
          format: int64
          description: Cents
        close:
          type: integer
          format: int64
          description: Cents
        volume:
          type: ['number', 'null']

    PricesResponse:
      type: object
      required: [from, to, series, missing]
      properties:
        from:
          type: string
          format: date-time
          description: Resolved window start
        to:
          type: string
          format: date-time
          description: Resolved window end
        series:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/PriceBar'
          description: Symbol → ordered bars within the window
        missing:
          type: array
          items:
            type: string
          description: Requested symbols not in universe / with no bars

    # --- Evaluate ---

    EvaluateOrder:
      type: object
      required: [symbol, side, quantity, at]
      properties:
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/OrderSide'
        quantity:
          type: number
          exclusiveMinimum: 0
          description: Fractional shares (NUMERIC 20,8); must be > 0
        at:
          type: string
          format: date-time
          description: ISO-8601 — when this order executes

    EvaluateRequest:
      type: object
      required: [startingCash, orders]
      properties:
        startingCash:
          type: integer
          format: int64
          description: Cents
        orders:
          type: array
          items:
            $ref: '#/components/schemas/EvaluateOrder'

    EvaluatedOrder:
      type: object
      required: [symbol, side, quantity, at, fillPrice, status, rejectReason]
      properties:
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/OrderSide'
        quantity:
          type: number
        at:
          type: string
          format: date-time
        fillPrice:
          type: ['integer', 'null']
          format: int64
          description: Cents/share at-or-before `at`; null if rejected
        status:
          type: string
          enum: [filled, rejected]
        rejectReason:
          type: ['string', 'null']
          description: >-
            SYMBOL_NOT_TRADEABLE | STALE_PRICE | INSUFFICIENT_FUNDS |
            INSUFFICIENT_POSITION

    FinalPosition:
      type: object
      required: [symbol, quantity, avgCost]
      properties:
        symbol:
          type: string
        quantity:
          type: number
        avgCost:
          type: integer
          format: int64
          description: Cents per share (cost basis)

    EquityPoint:
      type: object
      required: [ts, equity]
      properties:
        ts:
          type: string
          format: date-time
        equity:
          type: integer
          format: int64
          description: Cents

    EvaluateResponse:
      type: object
      required:
        [
          orders,
          finalCash,
          finalPositions,
          finalEquity,
          totalReturnPct,
          equityCurve,
        ]
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/EvaluatedOrder'
        finalCash:
          type: integer
          format: int64
          description: Cents
        finalPositions:
          type: array
          items:
            $ref: '#/components/schemas/FinalPosition'
        finalEquity:
          type: ['integer', 'null']
          format: int64
          description: Cents (finalCash + Σ qty × last close)
        totalReturnPct:
          type: ['number', 'null']
          description: Return vs startingCash
        equityCurve:
          type: array
          items:
            $ref: '#/components/schemas/EquityPoint'

    # --- Admin ---

    UpsertUniverseRequest:
      type: object
      required: [symbols]
      properties:
        symbols:
          type: array
          items:
            type: string
          description: Symbols to add or update in the corpus

    BackfillRequest:
      type: object
      required: [symbol]
      properties:
        symbol:
          type: string
          description: Symbol to re-trigger backfill for

paths:
  # --- Auth & session ---

  /auth/{provider}/start:
    get:
      summary: Begin OAuth flow
      operationId: authStart
      tags: [auth]
      security: []
      parameters:
        - $ref: '#/components/parameters/provider'
      responses:
        '302':
          description: Redirect to provider
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/{provider}/callback:
    get:
      summary: OAuth redirect target; sets session cookie
      operationId: authCallback
      tags: [auth]
      security: []
      parameters:
        - $ref: '#/components/parameters/provider'
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to app
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/logout:
    post:
      summary: Clear session
      operationId: authLogout
      tags: [auth]
      responses:
        '204':
          description: Session cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/link/{provider}/start:
    post:
      summary: Link an additional SSO identity
      operationId: authLinkStart
      tags: [auth]
      parameters:
        - $ref: '#/components/parameters/provider'
      responses:
        '302':
          description: Redirect to provider
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /me:
    get:
      summary: Current user, linked identities, and CSRF token
      operationId: getMe
      tags: [user]
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # --- Platform: market data + evaluation ---

  /universe:
    get:
      summary: The corpus of symbols with backfill state and bar-coverage bounds
      operationId: getUniverse
      tags: [platform]
      parameters:
        - name: backfilled
          in: query
          required: false
          schema:
            type: boolean
          description: When true, only symbols with price history
      responses:
        '200':
          description: Universe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniverseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /prices:
    get:
      summary: Pricing history for a corpus, from price_bar
      operationId: getPrices
      tags: [platform]
      parameters:
        - name: symbols
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated symbols, e.g. AAPL,MSFT (≤ 100)
        - name: from
          in: query
          required: false
          schema:
            type: string
          description: ISO date/datetime; window start (default to − 2y)
        - name: to
          in: query
          required: false
          schema:
            type: string
          description: ISO date/datetime; window end (default now)
      responses:
        '200':
          description: Price history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /evaluate:
    post:
      summary: Evaluate the returns of a series of orders, replayed against history
      operationId: evaluate
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateRequest'
      responses:
        '200':
          description: Evaluation result (stateless; nothing persisted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # --- Admin ---

  /admin/universe/upsert:
    post:
      summary: Add or update corpus membership rows
      operationId: adminUpsertUniverse
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertUniverseRequest'
      responses:
        '200':
          description: Upserted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/universe/backfill:
    post:
      summary: Manually re-trigger backfill for a symbol
      operationId: adminBackfillUniverse
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackfillRequest'
      responses:
        '200':
          description: Backfill flag reset
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
