openapi: 3.1.0
info:
  title: tickr API
  version: v1
  description: Perpetual stock-trading leaderboard — v1 REST surface
servers:
  - url: /api/v1
    description: API v1

security:
  - cookieAuth: []

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session

  parameters:
    portfolioId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    orderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [google, github]
    limitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
    cursorParam:
      name: cursor
      in: query
      required: false
      schema:
        type: string

  responses:
    Unauthorized:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableEntity:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: Rate limited
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    # --- Enums ---

    OrderSide:
      type: string
      enum: [buy, sell]

    OrderType:
      type: string
      enum: [market]

    OrderStatus:
      type: string
      enum: [accepted, rejected, filled, cancelled]

    # --- Error envelope ---

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code, e.g. SYMBOL_NOT_TRADEABLE
            message:
              type: string
              description: Human-readable error message
            details:
              description: Additional error context (implementation-defined)

    # --- Core entities ---

    User:
      type: object
      required: [id, displayName, email, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: ['string', 'null']
        role:
          type: string
          enum: [player, admin]
        createdAt:
          type: string
          format: date-time

    Identity:
      type: object
      required: [provider, emailAtLink]
      properties:
        provider:
          type: string
          enum: [google, github]
        emailAtLink:
          type: ['string', 'null']

    Portfolio:
      type: object
      required: [id, userId, algoId, cash, joinedAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        algoId:
          type: ['string', 'null']
          format: uuid
        cash:
          type: integer
          format: int64
          description: Cents available
        joinedAt:
          type: string
          format: date-time

    Order:
      type: object
      required:
        [
          id,
          portfolioId,
          symbol,
          side,
          type,
          quantity,
          status,
          rejectReason,
          idempotencyKey,
          source,
          createdAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        portfolioId:
          type: string
          format: uuid
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/OrderSide'
        type:
          $ref: '#/components/schemas/OrderType'
        quantity:
          type: number
          description: Fractional shares (NUMERIC 20,8)
        status:
          $ref: '#/components/schemas/OrderStatus'
        rejectReason:
          type: ['string', 'null']
        idempotencyKey:
          type: string
        source:
          type: string
          enum: [human, algo]
        createdAt:
          type: string
          format: date-time

    Fill:
      type: object
      required: [id, orderId, symbol, side, quantity, price, filledAt]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/OrderSide'
        quantity:
          type: number
          description: Fractional shares (NUMERIC 20,8)
        price:
          type: integer
          format: int64
          description: Cents per share at fill
        filledAt:
          type: string
          format: date-time

    ValuationSnapshot:
      type: object
      required: [id, portfolioId, takenAt, cash, positionsValue, equity]
      properties:
        id:
          type: string
          format: uuid
        portfolioId:
          type: string
          format: uuid
        takenAt:
          type: string
          format: date-time
        cash:
          type: integer
          format: int64
          description: Cents
        positionsValue:
          type: integer
          format: int64
          description: Cents (sum of qty × price)
        equity:
          type: integer
          format: int64
          description: Cents (cash + positionsValue)

    # --- View / response types ---

    PositionView:
      type: object
      required: [symbol, quantity, avgCost, lastPrice, marketValue]
      properties:
        symbol:
          type: string
        quantity:
          type: number
          description: Fractional shares
        avgCost:
          type: integer
          format: int64
          description: Cents per share (cost basis)
        lastPrice:
          type: ['integer', 'null']
          format: int64
          description: Latest price_bar.close in cents; null if not yet backfilled
        marketValue:
          type: ['integer', 'null']
          format: int64
          description: Cents (quantity × lastPrice); null if lastPrice is null

    PortfolioView:
      type: object
      required: [portfolio, positions, equity, buyingPower, lastSnapshotAt]
      properties:
        portfolio:
          $ref: '#/components/schemas/Portfolio'
        positions:
          type: array
          items:
            $ref: '#/components/schemas/PositionView'
        equity:
          type: ['integer', 'null']
          format: int64
          description: Cents (cash + sum of marketValues); best-effort live
        buyingPower:
          type: integer
          format: int64
          description: Cents; equals cash in v1 (no margin)
        lastSnapshotAt:
          type: ['string', 'null']
          format: date-time
          description: When the official ranking last refreshed

    MeResponse:
      type: object
      required: [user, identities, portfolioId]
      properties:
        user:
          $ref: '#/components/schemas/User'
        identities:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
        portfolioId:
          type: string
          format: uuid
          description: v1 — each user has exactly one portfolio

    CreateOrderRequest:
      type: object
      required: [symbol, side, type, quantity, idempotencyKey]
      properties:
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/OrderSide'
        type:
          $ref: '#/components/schemas/OrderType'
        quantity:
          type: number
          exclusiveMinimum: 0
          description: Fractional shares; must be > 0
        idempotencyKey:
          type: string
          description: Client-generated deduplication key

    CreateOrderResponse:
      type: object
      required: [order, fill]
      properties:
        order:
          $ref: '#/components/schemas/Order'
        fill:
          oneOf:
            - $ref: '#/components/schemas/Fill'
            - type: 'null'
          description: Present if immediately filled (v1 model)

    OrdersPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        nextCursor:
          type: ['string', 'null']

    HistoryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ValuationSnapshot'
        nextCursor:
          type: ['string', 'null']

    LeaderboardRowItem:
      type: object
      required: [rank, portfolioId, displayName, isBot, equity, returnPct]
      properties:
        rank:
          type: integer
        portfolioId:
          type: string
          format: uuid
        displayName:
          type: string
          description: User display name; "index" for the bot
        isBot:
          type: boolean
        equity:
          type: integer
          format: int64
          description: Cents
        returnPct:
          type: number
          description: Return vs starting capital

    LeaderboardResponse:
      type: object
      required: [takenAt, rows, nextCursor]
      properties:
        takenAt:
          type: string
          format: date-time
          description: Snapshot this ranking reflects
        rows:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardRowItem'
        nextCursor:
          type: ['string', 'null']

    QuoteEntry:
      type: object
      required: [price, ts]
      properties:
        price:
          type: ['integer', 'null']
          format: int64
          description: Latest price_bar.close in cents
        ts:
          type: ['string', 'null']
          format: date-time
          description: Timestamp of the price bar

    QuotesResponse:
      type: object
      required: [asOf, quotes]
      properties:
        asOf:
          type: string
          format: date-time
          description: Latest price_bar timestamp considered
        quotes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/QuoteEntry'
          description: Symbol → QuoteEntry map

    SymbolItem:
      type: object
      required: [symbol, backfilled]
      properties:
        symbol:
          type: string
        backfilled:
          type: boolean
          description: false → not yet tradeable

    SymbolsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SymbolItem'

    UpsertUniverseRequest:
      type: object
      required: [symbols]
      properties:
        symbols:
          type: array
          items:
            type: string
          description: S&P 500 symbols to add or update

    BackfillRequest:
      type: object
      required: [symbol]
      properties:
        symbol:
          type: string
          description: Symbol to re-trigger backfill for

    OpsResponse:
      type: object
      required:
        [
          lastSnapshotAt,
          snapshotLagSec,
          finnhubRest429sLast24h,
          jobQueueDepth,
          backfillRemaining,
        ]
      properties:
        lastSnapshotAt:
          type: ['string', 'null']
          format: date-time
        snapshotLagSec:
          type: ['integer', 'null']
          format: int64
        finnhubRest429sLast24h:
          type: integer
        jobQueueDepth:
          type: integer
        backfillRemaining:
          type: integer
          description: Count of universe_symbol where backfilled = false

paths:
  # --- Auth & session ---

  /auth/{provider}/start:
    get:
      summary: Begin OAuth flow
      operationId: authStart
      tags: [auth]
      security: []
      parameters:
        - $ref: '#/components/parameters/provider'
      responses:
        '302':
          description: Redirect to provider
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/{provider}/callback:
    get:
      summary: OAuth redirect target; sets session cookie
      operationId: authCallback
      tags: [auth]
      security: []
      parameters:
        - $ref: '#/components/parameters/provider'
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to app
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/logout:
    post:
      summary: Clear session
      operationId: authLogout
      tags: [auth]
      responses:
        '204':
          description: Session cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/link/{provider}/start:
    post:
      summary: Link an additional SSO identity
      operationId: authLinkStart
      tags: [auth]
      parameters:
        - $ref: '#/components/parameters/provider'
      responses:
        '302':
          description: Redirect to provider
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /me:
    get:
      summary: Current user, linked identities, and portfolio ID
      operationId: getMe
      tags: [user]
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # --- Portfolio & trading ---

  /portfolios/{id}:
    get:
      summary: Portfolio overview (cash, positions, best-effort equity)
      operationId: getPortfolio
      tags: [portfolio]
      parameters:
        - $ref: '#/components/parameters/portfolioId'
      responses:
        '200':
          description: Portfolio view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /portfolios/{id}/orders:
    get:
      summary: Order history (paginated)
      operationId: listOrders
      tags: [portfolio]
      parameters:
        - $ref: '#/components/parameters/portfolioId'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/cursorParam'
      responses:
        '200':
          description: Paginated order list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Submit an order
      operationId: createOrder
      tags: [portfolio]
      parameters:
        - $ref: '#/components/parameters/portfolioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created and filled (v1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Idempotency key conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /portfolios/{id}/orders/{orderId}/cancel:
    post:
      summary: Cancel an order if cancellable
      operationId: cancelOrder
      tags: [portfolio]
      parameters:
        - $ref: '#/components/parameters/portfolioId'
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Cancelled order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /portfolios/{id}/history:
    get:
      summary: Equity over time from valuation snapshots (paginated)
      operationId: getPortfolioHistory
      tags: [portfolio]
      parameters:
        - $ref: '#/components/parameters/portfolioId'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/cursorParam'
      responses:
        '200':
          description: Paginated valuation snapshot list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # --- Leaderboard ---

  /leaderboard:
    get:
      summary: Ranked rows from the latest snapshot
      operationId: getLeaderboard
      tags: [leaderboard]
      security: []
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/cursorParam'
      responses:
        '200':
          description: Leaderboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # --- Market data ---

  /quotes:
    get:
      summary: Latest price_bar.close per symbol
      operationId: getQuotes
      tags: [market]
      parameters:
        - name: symbols
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated symbols, e.g. AAPL,MSFT
      responses:
        '200':
          description: Quotes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /symbols:
    get:
      summary: S&P 500 universe (tradeable subset)
      operationId: getSymbols
      tags: [market]
      security: []
      responses:
        '200':
          description: Symbols
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SymbolsResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # --- Admin ---

  /admin/universe/upsert:
    post:
      summary: Add or update S&P 500 membership rows
      operationId: adminUpsertUniverse
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertUniverseRequest'
      responses:
        '204':
          description: Upserted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/universe/backfill:
    post:
      summary: Manually re-trigger backfill for a symbol
      operationId: adminBackfillUniverse
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackfillRequest'
      responses:
        '202':
          description: Backfill enqueued
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/ops:
    get:
      summary: Operational view (snapshot lag, Finnhub rate limits, queue depth)
      operationId: adminGetOps
      tags: [admin]
      responses:
        '200':
          description: Ops status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
